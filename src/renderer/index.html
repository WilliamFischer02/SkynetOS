<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      docs/07-SECURITY.md: CSP on the renderer, no remote code in the main window.
      'unsafe-inline' for style-src is what Vite's dev server and React need for injected styles;
      script-src stays strict so nothing can be pulled in from off-machine.
      connect-src covers the dev server's HMR websocket.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               font-src 'self' data:;
               img-src 'self' data: blob:;
               connect-src 'self' ws://localhost:* http://localhost:*;
               object-src 'none';
               base-uri 'none';
               form-action 'none';
               frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkynetOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
