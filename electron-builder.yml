appId: co.goobentertainment.skynetos
productName: SkynetOS
copyright: Copyright © 2026 Goob Entertainment Co.

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # electron-builder pulls in production dependencies' node_modules even when `files` does not
  # list them. node-pty is declared for M3's embedded terminal, is not imported by anything yet,
  # and is not even compiled here — so it would ship several megabytes of conpty binaries for a
  # feature that does not exist. M3 removes this negation when the terminal actually lands.
  - "!node_modules/node-pty/**"

# ── Program files and starter data ───────────────────────────────────────────────────────────
# An installed SkynetOS does NOT run from the board/ and codex/ below. They are a SEED: copied once
# into a new home folder on a machine that has no repo, and never read again. The live data is in
# the home (packages/shared/home.ts), because an update replaces everything in resources/ and a
# board kept here would be overwritten by it. schema/, tools/, mediapipe/ and build-info.json ARE
# program files, read from here, and are meant to be replaced by every update.
extraResources:
  - from: board
    to: board
    filter:
      - "**/*"
      - "!.snapshots/**"
  - from: schema
    to: schema
  - from: assets/atlas
    to: assets/atlas
  # The pictures on the board. Board JSON points at these as `%SKYNET%/assets/sprites/...`, so they
  # have to sit next to the executable in an install exactly as they sit in the repo — otherwise
  # every wallpaper and logo resolves as missing the moment SkynetOS is installed rather than run
  # from a checkout.
  - from: assets/sprites
    to: assets/sprites
  # The personas and the mailbox. `codex/` is read at launch by every agent node.
  - from: codex
    to: codex
  - from: assets/fonts
    to: assets/fonts
  # William's JARVIS face frames. Data, seeded with the rest.
  - from: assets/avatar
    to: assets/avatar
  # Manual (gesture) control. @mediapipe/tasks-vision is a devDependency, so it is not in app.asar;
  # the vision page is served these two from resources/mediapipe (src/main/services/vision.ts).
  - from: node_modules/@mediapipe/tasks-vision/vision_bundle.mjs
    to: mediapipe/vision_bundle.mjs
  - from: node_modules/@mediapipe/tasks-vision/wasm
    to: mediapipe/wasm
  # Written by tools/build-info.mjs just before packaging: version, commit, and the repo this build
  # was made in, which is how an install on this machine finds its data home.
  - from: build/build-info.json
    to: build-info.json
  # tools/skynet-mcp.mjs is spawned as a CHILD PROCESS by Claude Code, not imported by the app, so
  # it cannot live inside app.asar — `node <path-inside-asar>` would find nothing there. It has no
  # dependencies of its own on purpose, so it is the only file that needs to come along.
  - from: tools/skynet-mcp.mjs
    to: tools/skynet-mcp.mjs

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

# Updates. `npm run dist` writes release/latest.yml beside the installer; an installed SkynetOS
# reads the same file from the newest GitHub release (src/main/services/updater.ts). Nothing here
# uploads anything: publishing a release is `npm run release:publish`, which William runs himself.
publish:
  provider: github
  owner: WilliamFischer02
  repo: SkynetOS
  releaseType: release

nsis:
  oneClick: false
  # Per user, under %LOCALAPPDATA%/Programs: no administrator prompt to install OR to update, which
  # is what lets an update install itself quietly when SkynetOS closes.
  perMachine: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Uninstalling removes the program. It must never take %APPDATA%/SkynetOS (sessions, settings,
  # paired devices) or the home folder with it.
  deleteAppDataOnUninstall: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SkynetOS

# No native modules are in the packaged app today. `node-pty` sits in optionalDependencies for
# M3's embedded terminal and is not imported yet, and it has no working node-gyp toolchain on
# this machine — so letting @electron/rebuild loose on it fails the build for a module nothing
# uses. M3 flips this back to true and rebuilds node-pty against Electron's ABI.
npmRebuild: false
